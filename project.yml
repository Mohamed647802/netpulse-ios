name: NetPulse
options:
  bundleIdPrefix: com.netpulse
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  knownRegions:
    - ar
    - en
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO

targets:
  NetPulse:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: NetPulse
        excludes:
          - "Resources/Info.plist"
          - "Resources/NetPulse.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netpulse.app
        PRODUCT_NAME: NetPulse
        INFOPLIST_FILE: NetPulse/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NetPulse/Resources/NetPulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: libsqlite3.tbd
      - target: NetPulseWidget
        embed: true

  NetPulseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: NetPulseWidget
        excludes:
          - "Info.plist"
          - "NetPulseWidget.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netpulse.app.widget
        PRODUCT_NAME: NetPulseWidget
        INFOPLIST_FILE: NetPulseWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NetPulseWidget/NetPulseWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
